name: Milestone Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/milestones.json'
      - 'data/events.json'
      - 'data/activity.json'
      - 'Milestones.md'

permissions:
  contents: read

jobs:
  notify:
    name: Verify data freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Milestones.md exists
        run: |
          if [ ! -f Milestones.md ]; then
            echo "::error::Milestones.md missing — apis pipeline may not have run yet"
            exit 1
          fi
          echo "Milestones.md OK ($(wc -l < Milestones.md) lines, $(wc -c < Milestones.md) bytes)"
