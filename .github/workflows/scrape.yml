name: Milestone Tracker

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [refresh]

permissions:
  contents: write

jobs:
  dispatch-engine:
    name: Dispatch API engine
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - name: Trigger transhumanists/apis pipeline
        id: dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: transhumanists/apis
          event-type: run-scrape
          client-payload: '{"source": "transhumanists/milestones", "ref": "${{ github.ref }}"}'
